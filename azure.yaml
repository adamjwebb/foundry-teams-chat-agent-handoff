# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  extensions:
    azure.ai.agents: ">=1.0.0-beta.19"
    azure.ai.projects: ">=1.0.0-beta.13"

name: foundry-teams-chat-agent-poc

services:
  ai-project:
    host: azure.ai.project
    endpoint: ${AZURE_AI_PROJECT_ENDPOINT}

  foundry-teams-chat-agent:
    host: azure.ai.agent
    project: src/foundry-teams-chat-agent
    language: python
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
    uses:
      - ai-project
    kind: hosted
    name: foundry-teams-chat-agent
    displayName: Foundry Teams Chat Agent POC
    description: >
      Teams chat agent that uses recent group-chat context to answer questions
      with the provisioned Foundry model.
    protocols:
      - protocol: activity
        version: 2.0.0
    activity:
      publish:
        publishScope: shared
        agentDisplayName: Foundry Teams Chat Agent POC
    agentEndpoint:
      protocols:
        - activity
      authorizationSchemes:
        - type: BotServiceRbac
    environmentVariables:
      - name: AZURE_AI_PROJECT_ENDPOINT
        value: ${AZURE_AI_PROJECT_ENDPOINT}
      - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
        value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      - name: GRAPH_HISTORY_MESSAGE_COUNT
        value: "10"
    container:
      resources:
        cpu: "0.5"
        memory: 1Gi

infra:
  provider: bicep
  path: ./infra

hooks:
  postdeploy:
    windows:
      run: ./scripts/provision-bot.ps1
      shell: pwsh
      interactive: false
      continueOnError: false
    posix:
      run: ./scripts/provision-bot.sh
      shell: sh
      interactive: false
      continueOnError: false
